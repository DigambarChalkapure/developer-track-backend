services:
  - type: web
    name: developer-tracker-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: MONGO_URI
        sync: false  # Set this manually in Render dashboard — do not hardcode secrets
